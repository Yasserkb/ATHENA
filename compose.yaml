name: athena-codegraph

services:
  athena:
    image: ${ATHENA_IMAGE:-athena-codegraph:local}
    build:
      context: .
      args:
        VERSION: ${ATHENA_VERSION:-0.2.0}
        VCS_REF: ${VCS_REF:-local}
        BUILD_DATE: ${BUILD_DATE:-unknown}
        SOURCE_URL: ${SOURCE_URL:-https://github.com/Yasserkb/ATHENA}
    command:
      # A detached Compose service cannot provide an MCP STDIO session. Run the watcher in the
      # foreground instead; clients start their own short-lived MCP STDIO process when needed.
      - daemon
      - run
      - --root
      - /workspace
    stdin_open: true
    tty: false
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: ${ATHENA_MEMORY_LIMIT:-1g}
    cpus: ${ATHENA_CPU_LIMIT:-2.0}
    environment:
      ATHENA_ROOT: /workspace
      ATHENA_STATE_DIR: /data
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - type: bind
        source: ${ATHENA_WORKSPACE:-.}
        target: /workspace
        read_only: true
      - type: volume
        source: athena-data
        target: /data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m

  observatory:
    profiles: ["observatory"]
    image: ${ATHENA_IMAGE:-athena-codegraph:local}
    build:
      context: .
      args:
        VERSION: ${ATHENA_VERSION:-0.2.0}
        VCS_REF: ${VCS_REF:-local}
        BUILD_DATE: ${BUILD_DATE:-unknown}
        SOURCE_URL: ${SOURCE_URL:-https://github.com/Yasserkb/ATHENA}
    command:
      - observatory
      - start
      - --root
      - /workspace
      - --host
      - 0.0.0.0
      - --port
      - "8765"
      - --no-open
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: ${ATHENA_OBSERVATORY_MEMORY_LIMIT:-256m}
    cpus: ${ATHENA_OBSERVATORY_CPU_LIMIT:-0.5}
    environment:
      ATHENA_ROOT: /workspace
      ATHENA_STATE_DIR: /data
      ATHENA_OBSERVATORY_STATE: /data/observatory.json
      PYTHONDONTWRITEBYTECODE: "1"
    ports:
      - "127.0.0.1:${ATHENA_OBSERVATORY_PORT:-8765}:8765"
    volumes:
      - type: bind
        source: ${ATHENA_WORKSPACE:-.}
        target: /workspace
        read_only: true
      - type: volume
        source: athena-data
        target: /data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=2)"]
      interval: 15s
      timeout: 4s
      retries: 3
      start_period: 5s
    networks:
      - athena-observatory

volumes:
  athena-data:
    name: ${ATHENA_VOLUME_NAME:-athena-codegraph-data}

networks:
  athena-observatory:
    internal: true
