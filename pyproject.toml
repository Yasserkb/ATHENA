[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "athena-codegraph"
version = "0.2.0"
description = "Local-first code knowledge graph and persona-aware context engine for coding assistants"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Athena Team"}]
keywords = ["mcp", "code-graph", "developer-tools", "copilot", "claude", "codex"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "pathspec>=0.12,<1",
  "typer>=0.12,<1",
  "watchfiles>=1.0,<2",
]

[project.optional-dependencies]
mcp = ["mcp>=1.27,<2"]
tokenizers = ["tiktoken>=0.8,<1"]
claude-tokenizer = ["anthropic>=0.70,<2"]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.12,<1",
  "mypy>=1.15,<2",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
athena = "athena.cli:app"

[project.urls]
Homepage = "https://github.com/Yasserkb/ATHENA"
Documentation = "https://github.com/Yasserkb/ATHENA#readme"
Issues = "https://github.com/Yasserkb/ATHENA/issues"
Source = "https://github.com/Yasserkb/ATHENA"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"athena" = ["py.typed"]
"athena.personas.definitions" = ["*.yaml"]
"athena.personas.knowledge" = ["*/*.md"]
"athena.observatory" = ["static/*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["athena"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["athena.mcp.server"]
disallow_untyped_decorators = false

[tool.coverage.run]
source = ["athena"]
branch = true
omit = [
  "src/athena/__main__.py",
  "src/athena/cli.py",
  "src/athena/mcp/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 80
