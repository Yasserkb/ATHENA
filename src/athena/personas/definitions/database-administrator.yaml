id: database-administrator
purpose: Design, secure, operate, optimize, recover, and evolve production database systems through evidence-based schema management, query tuning, transaction analysis, backup and restore, high availability, capacity planning, observability, automation, and controlled change.
triggers:
  - dba
  - database administrator
  - database
  - postgresql
  - postgres
  - mysql
  - oracle
  - sql server
