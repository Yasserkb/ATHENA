name: publish-container

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to publish, for example 0.2.0
        required: true
        type: string
      latest:
        description: Also update the latest tag
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: docker-hub-publish
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Validate Dockerfile
        run: docker build --check .

      - name: Build release candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          push: false
          tags: athena-codegraph:release-candidate
          build-args: |
            VERSION=release-candidate
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha

      - name: Smoke-test release candidate
        run: |
          test "$(docker image inspect athena-codegraph:release-candidate --format '{{.Config.User}}')" = "10001:10001"
          docker run --rm athena-codegraph:release-candidate version

      - name: Report all release-candidate vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: athena-codegraph:release-candidate
          fail-build: false
          severity-cutoff: critical
          output-format: table
          cache-db: true

      # Keep unfixed distro findings visible above, but block publication whenever
      # a critical vulnerability has a remediation that this image has not applied.
      - name: Block fixable critical vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: athena-codegraph:release-candidate
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-format: table
          cache-db: true

  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: docker-hub
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Resolve and validate version
        id: version
        env:
          RAW_VERSION: ${{ github.event.release.tag_name || inputs.version }}
          RELEASE_LATEST: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
          MANUAL_LATEST: ${{ inputs.latest }}
        run: |
          version="${RAW_VERSION#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "Invalid semantic version: $RAW_VERSION" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          declared_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml | head -n 1)"
          if [ "$declared_version" != "$version" ]; then
            echo "Release version $version does not match package version $declared_version" >&2
            exit 1
          fi
          if [ "$RELEASE_LATEST" = "true" ] || [ "$MANUAL_LATEST" = "true" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || {
            echo "Missing DOCKERHUB_USERNAME in the docker-hub environment" >&2
            exit 1
          }
          test -n "$DOCKERHUB_TOKEN" || {
            echo "Missing DOCKERHUB_TOKEN in the docker-hub environment" >&2
            exit 1
          }

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Generate OCI metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: docker.io/${{ vars.DOCKERHUB_USERNAME }}/athena-codegraph
          flavor: latest=false
          labels: |
            org.opencontainers.image.title=Athena CodeGraph
            org.opencontainers.image.description=Local-first repository context and code graph MCP server
            org.opencontainers.image.licenses=Apache-2.0
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ steps.version.outputs.latest }}

      - name: Build and push multi-platform image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.version.outputs.created }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the published image digest with GitHub OIDC
        env:
          IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/athena-codegraph
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Write release summary
        run: |
          {
            echo "## Docker Hub image"
            echo
            echo '```text'
            echo "${{ steps.metadata.outputs.tags }}"
            echo '```'
            echo
            echo "Digest: \`${{ steps.push.outputs.digest }}\`"
            echo
            echo 'Verify the keyless signature:'
            echo '```text'
            echo "cosign verify ${{ vars.DOCKERHUB_USERNAME }}/athena-codegraph@${{ steps.push.outputs.digest }} --certificate-identity-regexp='^https://github.com/${{ github.repository }}/' --certificate-oidc-issuer='https://token.actions.githubusercontent.com'"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
