name: publish-container

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to publish, for example 0.2.0
        required: true
        type: string
      latest:
        description: Also update the latest tag
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: docker-hub-publish
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate Dockerfile
        run: docker build --check .

      - name: Build release candidate
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: athena-codegraph:release-candidate
          build-args: |
            VERSION=release-candidate
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha

      - name: Smoke-test release candidate
        run: |
          test "$(docker image inspect athena-codegraph:release-candidate --format '{{.Config.User}}')" = "10001:10001"
          docker run --rm athena-codegraph:release-candidate version

      - name: Report all release-candidate vulnerabilities
        uses: anchore/scan-action@v7
        with:
          image: athena-codegraph:release-candidate
          fail-build: false
          severity-cutoff: critical
          output-format: table
          cache-db: true

      # Keep unfixed distro findings visible above, but block publication whenever
      # a critical vulnerability has a remediation that this image has not applied.
      - name: Block fixable critical vulnerabilities
        uses: anchore/scan-action@v7
        with:
          image: athena-codegraph:release-candidate
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-format: table
          cache-db: true

  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: docker-hub
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Resolve and validate version
        id: version
        env:
          RAW_VERSION: ${{ github.event.release.tag_name || inputs.version }}
          RELEASE_LATEST: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
          MANUAL_LATEST: ${{ inputs.latest }}
        run: |
          version="${RAW_VERSION#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "Invalid semantic version: $RAW_VERSION" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          if [ "$RELEASE_LATEST" = "true" ] || [ "$MANUAL_LATEST" = "true" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate OCI metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ vars.DOCKERHUB_USERNAME }}/athena-codegraph
          flavor: latest=false
          labels: |
            org.opencontainers.image.title=Athena CodeGraph
            org.opencontainers.image.description=Local-first repository context and code graph MCP server
            org.opencontainers.image.licenses=Apache-2.0
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ steps.version.outputs.latest }}

      - name: Build and push multi-platform image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.version.outputs.created }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write release summary
        run: |
          {
            echo "## Docker Hub image"
            echo
            echo '```text'
            echo "${{ steps.metadata.outputs.tags }}"
            echo '```'
            echo
            echo "Digest: \`${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
